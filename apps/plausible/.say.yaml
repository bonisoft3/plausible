# generated by pronto from program.cue — do not edit
say:
  generate:
    rulemap:
      omnishell:
        priority: 0
        cmds:
          - do: mise run omnishell -- mode . --local | save --force program_terminal.cue
  integrate:
    rulemap:
      builtin:
        stop: false
      appearance:
        cmds:
          - do: docker compose up -d --wait --build launch
          - do: deno run --allow-read --allow-write --allow-net --allow-env --allow-run --allow-sys --unsafely-ignore-certificate-errors tests/appearance.ts .
      visual:
        cmds:
          - do: mise exec -- docker compose up -d --wait --build launch
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'plausible') --profile '*' -f .bayt/compose.integrate.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
  launch:
    rulemap:
      builtin:
        cmds:
          - do: 'if not (''.certs/localhost.pem'' | path exists) { mkdir .certs; mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1 }'
          - do: launch
            use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
          - do: mise exec -- cue vet ./...
      facts:
        priority: 1
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .'
      identity:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join identity.ts) check .'
      caddy:
        cmds:
          - do: 'with-env {ELECTRIC_SECRET: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == "windows" { "NUL" } else { "/dev/null" }) }'
      handlers:
        cmds:
          - do: mise run omnishell -- check handlers .
      markup:
        cmds:
          - do: mise run omnishell -- check markup .
      derive:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read=. ($pronto | path join derive.ts) --self-test'
      types:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; let files = do { cd $pronto; [ ...(glob --no-dir ''*.ts'') ...(glob --no-dir ''scales/*.ts'') ] }; run-mise exec -- deno check --config ($pronto | path join deno.json) ...$files'
      proto:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .'
  release:
    rulemap:
      pages:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = "../../plugins/pronto"; run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle bundle.ts) . --omnishell "../../plugins/omnishell" --mecha "../../libraries/mecha" --out dist/browser --base ($env.SAY_RELEASE_ARGS_BASE? | default "")'
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate --clean } else { release --snapshot --skip=validate --clean }'
            use: ./release.nu
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use semver.nu [tag-on-head]; let tag = (tag-on-head); if ($tag | is-empty) { error make {msg: "no release tag on HEAD to push"} }; git push origin $tag }'
        platform: pages
  setup:
    rulemap:
      builtin:
        cmds:
          - do: setup
            use: ./setup.nu
          - do: mkdir .certs
          - do: 'mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1'
          - do: 'print ''the browser trusts this certificate only once you run: mise exec -- mkcert -install'''
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
          - do: test
            use: ./test.nu
      oracle:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/oracle.test.ts
      fixture:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/fixture.test.ts
      stitch:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/stitch.test.ts
      clock:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/clock.test.ts
      coherent:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/coherent.test.ts
      svg:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/svg.test.ts
      questions:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/questions.test.ts
      sweep:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/sweep.test.ts
      coverage:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read --allow-run=mise tests/coverage.test.ts
      machines:
        cmds:
          - do: mise run omnishell -- check machines .
      battery:
        cmds:
          - do: mise run omnishell -- check battery .
